<!DOCTYPE html><html lang="nl"><head><meta charset="utf-8"><title>Tajine2Go — QR-standaard</title>
<meta name="omelette-print-source" content="v1787473268943148 guidelines/qr-standaard.html">
<link rel="stylesheet" href="../styles.css">
<style>
*{-webkit-print-color-adjust:exact;print-color-adjust:exact}
*{animation-delay:-99s !important;animation-duration:.001s !important;animation-iteration-count:1 !important;animation-fill-mode:both !important;animation-play-state:running !important;transition-duration:0s !important}
doc-page:not(:defined){visibility:hidden}
body{color:var(--text-body);font-family:var(--font-body)}
.page{position:relative;background:var(--t2g-papier);overflow:hidden}
.buiten{position:absolute;left:20mm;top:56mm;width:170mm;display:flex;flex-direction:column;pointer-events:none}
.buiten>img{width:100%;display:block}
.buiten .mid{width:100%;height:84mm;background:url('../assets/elements/tajine2go-boogkader-midden.svg') repeat-y;background-size:100% auto}
.lijnen{position:absolute;left:36mm;top:74mm;width:138mm;display:flex;flex-direction:column;pointer-events:none}
.lijnen>img{width:100%;display:block}
.lijnen .mid{width:100%;height:76mm;background:url('../assets/elements/tajine2go-boogkader-midden.svg') repeat-y;background-size:100% auto}
.content{position:absolute;left:50%;transform:translateX(-50%);top:92mm;width:88mm;box-sizing:border-box;display:grid;grid-template-columns:minmax(0,1fr);justify-items:center;gap:3mm;text-align:center}
.eyebrow{font-family:var(--font-display);font-weight:600;font-size:9.5pt;letter-spacing:.22em;text-transform:uppercase;color:var(--t2g-espresso)}
.cols{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:auto auto auto auto;gap:1.6mm 3mm;width:100%;justify-items:center}
.col{display:grid;grid-template-rows:subgrid;grid-row:span 4;min-width:0;justify-items:center;align-content:start}
.niche{position:relative;width:14mm;aspect-ratio:1025/1534}
.niche>img{position:absolute;inset:0;width:100%;height:100%}
.niche .binnen{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:grid;place-items:center}
.qrimg,.ph{width:7.2mm;aspect-ratio:1;display:block}
.ph{display:grid;place-items:center;border:.3mm dashed rgba(131,70,32,.45);font-size:6pt;line-height:1.25;color:var(--text-soft);padding:.6mm;box-sizing:border-box;background:var(--t2g-papier)}
.lab{font-family:var(--font-display);font-weight:600;font-size:5.6pt;letter-spacing:.06em;text-transform:uppercase;color:var(--t2g-espresso);line-height:1.35}
.val{font-size:5pt;font-weight:600;color:var(--t2g-inkt);word-break:break-all}
.bsaha{display:flex;align-items:center;gap:5mm;width:100%;box-sizing:border-box}
.bsaha i{flex:1;height:.3mm;background:rgba(131,70,32,.4)}
.bsaha b{font-family:var(--font-display);font-weight:600;font-size:12pt;letter-spacing:.22em;text-transform:uppercase;color:var(--t2g-espresso);white-space:nowrap}
</style>
<script src="https://unpkg.com/lucide@0.454.0/dist/umd/lucide.min.js"></script>
</head><body>
<doc-page size="a4">
<section class="page">
<div class="buiten">
<img src="../assets/elements/tajine2go-boogkader-top.svg" alt="">
<div class="mid"></div>
<img src="../assets/elements/tajine2go-boogkader-voet.svg" alt="">
</div>
<div class="lijnen">
<img src="../assets/elements/tajine2go-boogkader-top.svg" alt="">
<div class="mid"></div>
<img src="../assets/elements/tajine2go-boogkader-voet.svg" alt="">
</div>
<div class="content">
<div style="display:grid;justify-items:center">
<img src="../assets/logo/tajine2go-stacked-light.svg" alt="Tajine2Go" style="width:30.4mm;position:static">
<span class="eyebrow" style="margin-top:1.6mm;font-size:.8em">Laat van je horen</span>
<img src="../assets/elements/tajine2go-ornament.svg" alt="" style="width:120px;height:auto;margin-top:2.4mm;opacity:.55">
</div>
<div class="cols">
<div class="col">
<div class="niche">
<img src="../assets/elements/tajine2go-frame.svg" alt="">
<span class="binnen"><img class="qrimg" src="../assets/qr/tajine2go-qr-ink-on-paper.svg" alt="QR naar tajine2go.be"></span>
</div>
<span class="lab">Bezoek ons<br>website</span>
<span class="val">tajine2go.be</span>
<span style="color:var(--t2g-espresso);display:grid;place-items:center"><i data-lucide="globe" style="width:9px;height:9px"></i></span>
</div>
<div class="col">
<div class="niche">
<img src="../assets/elements/tajine2go-frame.svg" alt="">
<span class="binnen"><span class="ph">QR Instagram<br>volgt</span></span>
</div>
<span class="lab">Volg ons</span>
<span class="val">@tajine2go.gent</span>
<span style="color:var(--t2g-espresso);display:grid;place-items:center"><i data-lucide="instagram" style="width:9px;height:9px"></i></span>
</div>
<div class="col">
<div class="niche">
<img src="../assets/elements/tajine2go-frame.svg" alt="">
<span class="binnen"><span class="ph">QR Facebook<br>volgt</span></span>
</div>
<span class="lab">Like ons op<br>Facebook</span>
<span class="val"></span>
<span style="color:var(--t2g-espresso);display:grid;place-items:center"><i data-lucide="facebook" style="width:9px;height:9px"></i></span>
</div>
<div class="col">
<div class="niche">
<img src="../assets/elements/tajine2go-frame.svg" alt="">
<span class="binnen"><span class="ph">QR Google<br>volgt</span></span>
</div>
<span class="lab">Beoordeel<br>ons</span>
<span class="val"></span>
<span style="display:grid;justify-items:center;gap:.6mm;color:var(--t2g-espresso)">
<span style="font-family:var(--font-display);font-weight:600;font-size:6.4pt;letter-spacing:.06em">Google</span>
<span style="display:flex;gap:.8mm">
<i data-lucide="star" class="ster" style="width:8px;height:8px"></i><i data-lucide="star" class="ster" style="width:8px;height:8px"></i><i data-lucide="star" class="ster" style="width:8px;height:8px"></i><i data-lucide="star" class="ster" style="width:8px;height:8px"></i><i data-lucide="star" class="ster" style="width:8px;height:8px"></i>
</span>
</span>
</div>
</div>
<div class="bsaha"><i></i><b>Bsaha</b><i></i></div>
</div>
</section>
</doc-page>
<script src="./doc-page.js"></script>
<script>window.lucide&&lucide.createIcons();document.querySelectorAll('.ster svg,svg.ster').forEach(s=>{s.setAttribute('fill','currentColor');s.setAttribute('stroke','currentColor')})</script>
</body></html>
