<!-- @dsCard group="Spacing" viewport="700x170" name="Hoeken en schaduw" subtitle="Pill-knoppen, 16px kaarten, 24px platen; zachte inkt-schaduw" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--surface-page);font-family:var(--font-body);color:var(--text-body)}</style></head><body>
<div style="display:flex;align-items:center;gap:24px;padding:20px 28px">
<button style="font-family:var(--font-body);font-weight:600;color:var(--t2g-papier);background:var(--t2g-actie);border:none;border-radius:var(--radius-button);padding:12px 28px;font-size:16px">pill</button>
<div style="width:130px;height:90px;background:#fff;border-radius:var(--radius-card);box-shadow:var(--shadow-card);display:grid;place-items:center;font-size:13px;color:var(--text-soft)">kaart 16px</div>
<div style="width:130px;height:90px;background:var(--surface-dark);border-radius:var(--radius-plate);display:grid;place-items:center;font-size:13px;color:var(--text-on-dark)">plaat 24px</div>
<div style="width:130px;height:90px;background:#fff;border-radius:var(--radius-card);box-shadow:var(--shadow-card-hover);display:grid;place-items:center;font-size:13px;color:var(--text-soft)">hover-schaduw</div>
</div></body></html>
